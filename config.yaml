# vLLM Semantic Router
# Users only configure: version, listeners, signals, decisions, llm
# System defaults (semantic_cache, classifier, etc.) are provided by CLI

version: v0.1

# Listeners - Network configuration
listeners:
  - name: "http-8888"
    address: "0.0.0.0"
    port: 8888
    timeout: "300s"

# Signals - Classification signals for routing
signals:
  # Keyword-based signals
  keywords:
    - name: "math_keywords"
      operator: "OR"
      keywords:
        - "calculate"
        - "equation"
      case_sensitive: false

    - name: "code_keywords"
      operator: "OR"
      keywords:
        - "function"
        - "class"
      case_sensitive: false

    - name: "looper_keywords"
      operator: "OR"
      keywords:
        - "looper"
        - "collaborative"
      case_sensitive: false

  # domains - Domain categories (optional, can be auto-generated)
  domains:
    - name: "math"
      description: "Mathematics and quantitative reasoning"
      mmlu_categories: ["math"]

    - name: "computer_science"
      description: "Programming and computer science"
      mmlu_categories: ["computer_science"]

    - name: "physics"
      description: "Physics and physical sciences"
      mmlu_categories: ["physics"]

    - name: "geography"
      description: "Geography and location-based queries"
      mmlu_categories: ["geography"]

    - name: "other"
      description: "General queries"
      mmlu_categories: ["other"]

# Decisions - Routing logic
decisions:
  - name: "math_route"
    description: "Route mathematical queries with reasoning enabled"
    priority: 100
    rules:
      operator: "OR"
      conditions:
        - type: "keyword"
          name: "math_keywords"
        - type: "domain"
          name: "math"
    modelRefs:
      - model: "local/qwen"
        use_reasoning: true
    plugins:
      - type: "system_prompt"
        configuration:
          system_prompt: "You are a mathematics expert. Provide step-by-step solutions with clear explanations."
      - type: "semantic-cache"
        configuration:
          enabled: true
          similarity_threshold: 0.92

  - name: "physics_route"
    description: "Route physics queries with reasoning"
    priority: 100
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "physics"
    modelRefs:
      - model: "local/qwen"
        use_reasoning: true
    plugins:
      - type: "system_prompt"
        configuration:
          system_prompt: "You are a physics expert. Explain concepts clearly with mathematical derivations."

  - name: "geography_route"
    description: "Route geography queries"
    priority: 100
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "geography"
    modelRefs:
      - model: "local/tinyllama"
        use_reasoning: false
    plugins:
      - type: "system_prompt"
        configuration:
          system_prompt: "You are a geography expert. Provide detailed information about locations, cultures, and physical geography."

  - name: "code_route"
    description: "Route programming queries"
    priority: 100
    rules:
      operator: "OR"
      conditions:
        - type: "keyword"
          name: "code_keywords"
        - type: "domain"
          name: "computer_science"
    modelRefs:
      - model: "local/tinyllama"
        use_reasoning: true
    plugins:
      - type: "system_prompt"
        configuration:
          system_prompt: "You are a programming expert. Provide clear code examples."

  - name: "general_route"
    description: "Default fallback route for general queries"
    priority: 50
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "other"
    modelRefs:
      - model: "local/qwen"
        use_reasoning: false
    plugins:
      - type: "semantic-cache"
        configuration:
          enabled: true
          similarity_threshold: 0.85

  # Size-aware routing example: Try smaller models first, escalate if confidence is low
  - name: "confidence_route"
    description: "Cost-efficient routing: try small model first, escalate if needed"
    priority: 40
    rules:
      operator: "AND"
      conditions:
        - type: "domain"
          name: "other"
        - type: "keyword"
          name: "looper_keywords"
    modelRefs:
      - model: "local/qwen"
      - model: "local/tinyllama"
    algorithm:
      type: "confidence"
      confidence:
        # Confidence evaluation method (all normalized to 0-1, higher = more confident):
        # - "avg_logprob": Based on average token logprob
        # - "margin": Based on margin between top-1 and top-2 tokens
        # - "hybrid": Weighted combination of both
        confidence_method: "margin"
        threshold: 0.9      # Escalate to larger model if confidence < threshold (0-1)
        # For hybrid method, configure weights:
        # hybrid_weights:
        #   logprob_weight: 0.4
        #   margin_weight: 0.6
        on_error: "skip"    # Skip failed models, try next

  # Ratings algorithm example: Use multiple models, select best based on ratings
  - name: "ratings_route"
    description: "Route using ratings algorithm for model selection"
    priority: 60
    rules:
      operator: "OR"
      conditions:
        - type: "keyword"
          name: "looper_keywords"
        - type: "domain"
          name: "other"
    modelRefs:
      - model: "local/qwen"
      - model: "local/tinyllama"
    algorithm:
      type: "ratings"
      ratings:
        on_error: "skip"    # Skip failed models, try next
    plugins:
      - type: "semantic-cache"
        configuration:
          enabled: false

# LLM - Backend model configuration
providers:
  # Model configuration
  # param_size is used by confidence algorithm to sort models (smallest first)
  models:
    - name: "local/qwen"
      reasoning_family: "qwen3"
      param_size: "1.5b"
      endpoints:
        - name: "local_qwen"
          weight: 1
          endpoint: "host.docker.internal:8000"
          protocol: "http"
      access_key: "dummy-key"
    - name: "local/tinyllama"
      param_size: "1.1b"
      endpoints:
        - name: "local_tinyllama"
          weight: 1
          endpoint: "host.docker.internal:8001"
          protocol: "http"
      access_key: "dummy-key"

  # Default model for fallback
  default_model: "local/tinyllama"

  # Reasoning families configuration
  reasoning_families:
    gpt-oss:
      type: "reasoning_effort"
      parameter: "reasoning_effort"

  # Default reasoning effort level
  default_reasoning_effort: "high"


