# Standardized Node Stack
# Use with unique project names (docker-compose -p node-a -f docker-compose.node.yaml up)
services:
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: envoy-${NODE_ID}
    volumes:
      - ./${ENVOY_CONFIG}:/etc/envoy/envoy.yaml:ro
    ports:
      - "${HOST_PORT}:10000"
      - "${HEALTH_PORT}:8080"
    command: [ "-c", "/etc/envoy/envoy.yaml" ]
    depends_on: [ vllm-sr, mock-lb ]
    networks: [ router-net ]

  vllm-sr:
    image: vllm-sr:latest
    container_name: vllm-sr-${NODE_ID}
    pull_policy: never
    volumes:
      - ./config-${NODE_ID}.yaml:/app/config.yaml:ro
      - models-cache:/app/models
    networks:
      router-net:
        aliases: [ vllm-sr ]

  mock-lb:
    build: .
    image: mock-lb:local
    container_name: mock-lb-${NODE_ID}
    pull_policy: build
    command: [ "-port", "9000" ]
    networks:
      router-net:
        aliases: [ mock-lb ]

  target-qwen:
    image: mock-lb:local
    container_name: target-qwen-${NODE_ID}
    pull_policy: never
    command: [ "-target", "-target-port", "8000", "-target-name", "qwen-${NODE_ID}" ]
    depends_on: [ mock-lb ]
    networks:
      router-net:
        aliases: [ target-qwen ]

  target-tinyllama:
    image: mock-lb:local
    container_name: target-tinyllama-${NODE_ID}
    pull_policy: never
    command: [ "-target", "-target-port", "8001", "-target-name", "tinyllama-${NODE_ID}" ]
    depends_on: [ mock-lb ]
    networks:
      router-net:
        aliases: [ target-tinyllama ]

networks:
  router-net:
    driver: bridge

volumes:
  models-cache:
