# Envoy A - Node A (Mac). PEER_IP is replaced by run-node-a.sh (sed) with VM IP.
# Usage: export PEER_IP=<VM_IP> && ./run-node-a.sh
static_resources:
  listeners:
    - name: listener_a
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        # 1. Reroute to peer (VM) when Mock-LB sets x-reroute-target (e.g. >3 queries)
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-reroute-target"
                                exact_match: "peer"
                          route:
                            cluster: peer_cluster
                          request_headers_to_remove: ["x-reroute-target"]

                        # 2. Semantic routing (vLLM-SR sets x-selected-model)
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-selected-model"
                                exact_match: "local/qwen"
                          route: { cluster: local_qwen }

                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-selected-model"
                                exact_match: "local/tinyllama"
                          route: { cluster: local_tinyllama }

                        # 3. Default -> TinyLlama fallback
                        - match: { prefix: "/" }
                          route: { cluster: local_tinyllama }
                http_filters:
                  # ExtProc 1: vLLM-SR (semantic router)
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: vllm_sr_cluster
                      failure_mode_allow: false
                      message_timeout: 300s
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_header_mode: SKIP
                        response_body_mode: NONE

                  # ExtProc 2: Mock-LB (concurrency; sets x-reroute-target when >3)
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: mock_lb_cluster
                      failure_mode_allow: false
                      message_timeout: 300s
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: NONE
                        response_header_mode: DEFAULT
                        response_body_mode: NONE

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: vllm_sr_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: vllm_sr_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: vllm-sr-a, port_value: 50051 }

    - name: local_qwen
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_qwen
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: qwen-a, port_value: 8000 }

    - name: local_tinyllama
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_tinyllama
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tinyllama-a, port_value: 8001 }

    - name: mock_lb_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      http2_protocol_options: {}
      load_assignment:
        cluster_name: mock_lb_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: extproc-a, port_value: 9000 }

    # Peer = Node B (VM). PEER_IP substituted at startup.
    - name: peer_cluster
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: peer_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: __PEER_IP__, port_value: 10001 }

