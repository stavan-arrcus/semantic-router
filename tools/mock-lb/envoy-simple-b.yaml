# Envoy B - 1 ExtProc (Mock-LB). Same routing; peer = Envoy A. Every 4th request to B reroutes back to A.
static_resources:
  listeners:
    - name: listener_b
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-reroute-target"
                                exact_match: "peer"
                          route: { cluster: peer_cluster }
                          request_headers_to_remove: ["x-reroute-target"]
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-selected-model"
                                exact_match: "qwen"
                          route: { cluster: local_qwen }
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-selected-model"
                                exact_match: "llama"
                          route: { cluster: local_llama }
                        - match: { prefix: "/" }
                          route: { cluster: local_qwen }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: mock_lb_cluster
                      failure_mode_allow: false
                      message_timeout: 60s
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: NONE
                        response_header_mode: DEFAULT
                        response_body_mode: NONE
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: mock_lb_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: mock_lb_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: extproc-b, port_value: 9001 }
    - name: peer_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: peer_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: envoy-a, port_value: 10000 }
    - name: local_qwen
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_qwen
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: qwen-b, port_value: 8002 }
    - name: local_llama
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_llama
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: llama-b, port_value: 8003 }
