admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: listener_ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        # 0. Health check proxy
                        - match: { path: "/health" }
                          route: { cluster: mock_lb_health }

                        # 1. Reroute to peer node when Mock-LB signals overload
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-reroute-target"
                                exact_match: "peer"
                          route:
                            cluster: peer_cluster
                          request_headers_to_remove: ["x-reroute-target"]

                        # 2. Semantic routing (based on vLLM-SR headers)
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-selected-model"
                                exact_match: "local/qwen"
                          route: { cluster: local_qwen }

                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-selected-model"
                                exact_match: "local/tinyllama"
                          route: { cluster: local_tinyllama }

                        - match: { prefix: "/" }
                          route: { cluster: local_tinyllama }
                http_filters:
                  # ExtProc 1: vLLM-SR (Semantic Routing)
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: vllm_sr_cluster
                        timeout: 60s
                      failure_mode_allow: true
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_header_mode: SEND
                        response_body_mode: NONE
                      message_timeout: 60s

                  # ExtProc 2: Mock-LB (Load Balancing/Concurrency)
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: mock_lb_cluster
                        timeout: 60s
                      failure_mode_allow: true
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: DEFAULT
                      message_timeout: 60s

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: vllm_sr_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: vllm_sr_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: vllm-sr, port_value: 50051 }

    - name: local_qwen
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_qwen
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: target-qwen, port_value: 8000 }

    - name: local_tinyllama
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_tinyllama
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: target-tinyllama, port_value: 8001 }

    - name: mock_lb_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: mock_lb_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mock-lb, port_value: 9000 }

    - name: mock_lb_health
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: mock_lb_health
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mock-lb, port_value: 8080 }

    - name: peer_cluster
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: peer_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 192.168.64.4, port_value: 10000 }
              - endpoint:
                  address:
                    socket_address: { address: 192.168.64.8, port_value: 10000 }
      health_checks:
        - timeout: 1s
          interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 2
          http_health_check:
            path: "/health"

