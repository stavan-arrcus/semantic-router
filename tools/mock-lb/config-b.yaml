# vLLM Semantic Router - Optimal Node B Config
version: v0.1

listeners:
  - name: "http-8888"
    address: "0.0.0.0"
    port: 8888
    timeout: "300s"

# Selective registry with only 2 BERT models (Embedding + Domain)
# This keeps RAM usage ~1GB instead of 6GB.
mom_registry:
  "models/mom-embedding-light": "sentence-transformers/all-MiniLM-L12-v2"
  "models/mom-domain-classifier": "LLM-Semantic-Router/lora_intent_classifier_bert-base-uncased_model"

# Enable core semantic features
semantic_cache:
  enabled: true
  embedding_model: "bert" # Uses mom-embedding-light
  similarity_threshold: 0.82

# Keep safety/PII/hallucination disabled to save RAM
prompt_guard:
  enabled: false
  model_id: ""
feedback_detector:
  enabled: false
  model_id: ""
hallucination_mitigation:
  enabled: false
  fact_check_model:
    model_id: ""
  hallucination_model:
    model_id: ""
  nli_model:
    model_id: ""
classifier:
  pii_model:
    threshold: 1.0  # Effectiveness disabled
    model_id: ""    # Prevent extraction
  jailbreak_classifier:
    threshold: 1.0
    model_id: ""
embedding_models:
  qwen3_model_path: ""
  gemma_model_path: ""
looper:
  enabled: false

signals:
  keywords:
    - name: "math_keywords"
      operator: "OR"
      keywords: ["calculate", "equation", "integral", "sum", "math"]
      case_sensitive: false
    - name: "code_keywords"
      operator: "OR"
      keywords: ["function", "class", "python", "code", "debug"]
      case_sensitive: false

  # Domain signals trigger the mom-domain-classifier BERT model
  domains:
    - name: "math"
      description: "Math queries"
      mmlu_categories: ["math"]
    - name: "computer_science"
      description: "Code and CS queries"
      mmlu_categories: ["computer_science"]

decisions:
  - name: "math_route"
    description: "Route math queries to Qwen"
    priority: 100
    rules:
      operator: "OR"
      conditions:
        - type: "keyword"
          name: "math_keywords"
    modelRefs:
      - model: "local/qwen"
        use_reasoning: true

  - name: "code_route"
    description: "Route code queries to TinyLlama (keyword-only)"
    priority: 100
    rules:
      operator: "OR"
      conditions:
        - type: "keyword"
          name: "code_keywords"
    modelRefs:
      - model: "local/tinyllama"
        use_reasoning: false

providers:
  models:
    - name: "local/qwen"
      reasoning_family: "qwen3"
      param_size: "1.5b"
      endpoints:
        - name: "qwen_backend"
          weight: 1
          endpoint: "qwen-b:8000" # Updated to internal container
          protocol: "http"
      access_key: "dummy"
    - name: "local/tinyllama"
      param_size: "1.1b"
      endpoints:
        - name: "tinyllama_backend"
          weight: 1
          endpoint: "tinyllama-b:8001" # Updated to internal container
          protocol: "http"
      access_key: "dummy"
  default_model: "local/tinyllama"
