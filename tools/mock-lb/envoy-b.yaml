static_resources:
  listeners:
    - name: listener_b
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        # 1. Check for Reroute Header -> Send to Peer
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-reroute-target"
                                exact_match: "peer"
                          route: 
                            cluster: peer_cluster
                          request_headers_to_remove: ["x-reroute-target"]

                        # 2. Semantic Routing (Model Selection)
                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-selected-model"
                                exact_match: "local/qwen"
                          route: { cluster: local_qwen }

                        - match:
                            prefix: "/"
                            headers:
                              - name: "x-selected-model"
                                exact_match: "local/tinyllama"
                          route: { cluster: local_tinyllama }
                        
                        # 3. Default -> Fallback to Target (or Qwen)
                        - match: { prefix: "/" }
                          route: { cluster: target_cluster }
                http_filters:
                  # --- vLLM-SR (Semantic Router) ---
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: vllm_sr_cluster
                      failure_mode_allow: false
                      message_timeout: 300s
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: BUFFERED # Needs body to make decision
                        response_header_mode: SKIP
                        response_body_mode: NONE

                  # --- Load Balancer ExtProc ---
                  # It tracks concurrency and injects x-reroute-target if busy
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: mock_lb_cluster
                      failure_mode_allow: false
                      message_timeout: 300s
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: NONE
                        response_header_mode: DEFAULT
                        response_body_mode: NONE

                  # --- Router ---
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Cluster for vLLM Semantic Router
    - name: vllm_sr_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: vllm_sr_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: vllm-sr-b, port_value: 50051 }

    # Cluster for Qwen (Port 8002)
    - name: local_qwen
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_qwen
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: qwen-b, port_value: 8002 }

    # Cluster for TinyLlama (Port 8003)
    - name: local_tinyllama
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: local_tinyllama
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tinyllama-b, port_value: 8003 }

    # Cluster for our Mock Load Balancer (Port 9001 for B)
    - name: mock_lb_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      http2_protocol_options: {}
      load_assignment:
        cluster_name: mock_lb_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: extproc-b, port_value: 9001 }
 
    # Cluster for the Peer Envoy (Port 10000 for A)
    - name: peer_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: peer_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: envoy-a, port_value: 10000 }

    # Cluster for the actual LLM provider / Mock Target (Port 8888)
    - name: target_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: target_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mock-target, port_value: 8888 }
